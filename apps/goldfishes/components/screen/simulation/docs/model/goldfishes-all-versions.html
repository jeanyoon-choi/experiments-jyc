V.forEach((v,i)=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.label;pick.appendChild(o)});
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0)));
let cur=-1;
function show(i){i=(i+V.length)%V.length;if(i===cur)return;cur=i;const v=V[i];sim.srcdoc=dec(v.b64);pick.value=v.id;note.textContent=v.note;
 pos.textContent=`${String(i+1).padStart(2,'0')} / ${V.length}`;if(location.hash!=='#'+v.id)history.replaceState(null,'','#'+v.id)}
function fromHash(){const h=location.hash.slice(1);const i=V.findIndex(v=>v.id===h);show(i<0?V.length-1:i)}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
pick.onchange=()=>show(V.findIndex(v=>v.id===pick.value));
document.getElementById('fold').onclick=e=>{nav.classList.toggle('min');e.target.textContent=nav.classList.contains('min')?'설명':'접기'};
addEventListener('hashchange',fromHash);
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key===']')show(cur+1);if(e.key==='[')show(cur-1)});
fromHash();
